name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una nuova esecuzione sullo stesso ramo o PR annulla quella ancora in corso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Test .NET che non richiedono il workload MAUI: girano su Linux (veloce).
  dotnet:
    name: .NET (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test (core, architettura/rete, server, aggiornamenti, integrazione)
        run: |
          set -e
          for project in Core Architecture Server Updates Integration; do
            dotnet test "tests/Haedus.${project}.Tests" --nologo --logger "trx;LogFileName=${project}.trx" --results-directory TestResults
          done
      - name: Build degli strumenti (Bench)
        run: dotnet build tools/Haedus.Bench --nologo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: risultati-test-dotnet
          path: TestResults
          if-no-files-found: ignore

  # Typecheck, test e build della UI (app, server, preview statica).
  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build per il server
        run: npm run build:server
      - name: Build per l'app
        run: npm run build:app
      - name: Build della preview
        run: npm run build:preview

  # L'app MAUI e tutta la soluzione si compilano solo su Windows.
  windows:
    name: App Windows (build e test della soluzione)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Workload MAUI
        run: dotnet workload install maui-windows
      - name: UI per l'app
        working-directory: ui
        run: |
          npm ci
          npm run build:app
      - name: Test della soluzione
        run: dotnet test Haedus.slnx --nologo
      - name: Build dell'app (Release)
        run: dotnet build src/Haedus.App/Haedus.App.csproj -c Release --nologo

  # Immagine della versione server, con la stessa prova di scripts/test-locale.ps1 -Docker.
  docker:
    name: Docker (immagine server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build dell'immagine
        run: docker build -t haedus-server:ci .
      - name: Avvio e controlli (porta, token, /healthz)
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 16)
          docker run -d --name haedus-ci -p 127.0.0.1:5186:5185 -e "Haedus__AccessToken=$token" haedus-server:ci
          trap 'docker logs haedus-ci || true; docker rm -f haedus-ci' EXIT
          ok=0
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5186/healthz)" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "/healthz non risponde"; exit 1; }
          senza=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5186/)
          [ "$senza" = 401 ] || { echo "senza token atteso 401, ricevuto $senza"; exit 1; }
          con=$(curl -s -o /dev/null -w '%{http_code}' -b "haedus_access=$token" http://127.0.0.1:5186/)
          [ "$con" = 200 ] || { echo "con token atteso 200, ricevuto $con"; exit 1; }
          echo "Container ok: /healthz 200, senza token 401, con token 200"
